<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECRIMPO - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="header">
        <img src="../assets/img/logo-pmdf.svg" alt="Polícia Militar DF" class="logo-left">
        <img src="../assets/img/logo-gdf.svg" alt="Governo do Distrito Federal" class="logo-right">
    </div>
    
    <div class="main-container">
        <div class="login-container">
            <div class="access-title">
                <img src="../assets/img/logo-shield.svg" alt="Escudo" class="shield-icon">
                <h1>Acesso Restrito</h1>
            </div>
            <p class="access-subtitle">Autentique-se para acessar o sistema</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <div class="input-container">
                        <img src="../assets/img/usuario.svg" alt="Usuário" class="input-icon">
                        <select id="username" name="username" required>
                            <option value="">👤</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Senha</label>
                    <div class="input-container">
                        <img src="../assets/img/senha.svg" alt="Senha" class="input-icon">
                        <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
                    </div>
                </div>
                
                <button type="submit" class="btn-login" id="loginBtn">
                    Entrar no Sistema
                </button>
                
                <div id="message"></div>
                <div id="loading" class="loading">
                    Validando credenciais
                </div>
            </form>
        </div>
    </div>
    
    <div class="footer">
        <p><a href="#" class="footer-brand">SECRIMPO</a> © 2025 - Todos os direitos reservados.<br>
        Desenvolvido Por <strong>QuintoBit</strong></p>
    </div>
    
    <script src="auth.js"></script>
    <script>
        // Populate user dropdown on page load
        window.addEventListener('load', async () => {
            console.log('🔍 Loading users and checking authentication...');
            
            // Load users for dropdown
            await loadUsers();
            
            // Check if already authenticated
            if (await authManager.checkAuthStatus()) {
                console.log('✅ User already authenticated, redirecting...');
                showMessage('✅ Já autenticado! Redirecionando...', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } else {
                console.log('❌ No valid authentication found');
            }
        });
        
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                if (response.ok) {
                    const users = await response.json();
                    const userSelect = document.getElementById('username');
                    
                    // Clear existing options except the first one
                    userSelect.innerHTML = '<option value="">Selecione o usuário</option>';
                    
                    // Add users to dropdown
                    users.forEach(user => {
                        const option = document.createElement('option');
                        option.value = user.username;
                        option.textContent = user.username;
                        userSelect.appendChild(option);
                    });
                } else {
                    console.log('Could not load users, using text input fallback');
                    // Convert select to text input if API fails
                    const userSelect = document.getElementById('username');
                    const textInput = document.createElement('input');
                    textInput.type = 'text';
                    textInput.id = 'username';
                    textInput.name = 'username';
                    textInput.placeholder = 'Digite seu usuário';
                    textInput.autocomplete = 'username';
                    textInput.required = true;
                    userSelect.parentNode.replaceChild(textInput, userSelect);
                }
            } catch (error) {
                console.log('Error loading users:', error);
                // Convert select to text input on error
                const userSelect = document.getElementById('username');
                const textInput = document.createElement('input');
                textInput.type = 'text';
                textInput.id = 'username';
                textInput.name = 'username';
                textInput.placeholder = 'Digite seu usuário';
                textInput.autocomplete = 'username';
                textInput.required = true;
                userSelect.parentNode.replaceChild(textInput, userSelect);
            }
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loading = document.getElementById('loading');
            const message = document.getElementById('message');
            
            // Show loading state
            loginBtn.disabled = true;
            loading.style.display = 'block';
            message.innerHTML = '';
            loginBtn.textContent = 'Validando...';
            
            try {
                if (!username || !password) {
                    showMessage('Informe usuário e senha', 'error');
                    return;
                }
                const result = await authManager.loginWithPassword(username, password);
                
                if (result.success) {
                    showMessage(`✅ Login realizado com sucesso! Bem-vindo, ${result.data.user.username}`, 'success');
                    
                    // Show user info
                    setTimeout(() => {
                        showMessage(`🔄 Redirecionando para o sistema...`, 'success');
                    }, 1000);
                    
                    // Redirect to main application after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showMessage(`❌ Erro: ${result.error}`, 'error');
                }
            } catch (error) {
                showMessage(`🌐 Erro de conexão: ${error.message}`, 'error');
            } finally {
                loginBtn.disabled = false;
                loading.style.display = 'none';
                loginBtn.textContent = 'Entrar no Sistema';
            }
        });
        
        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.innerHTML = text;
            message.className = `message ${type === 'error' ? 'error-message' : 'success-message'}`;
        }
        
        // Handle Enter key
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
